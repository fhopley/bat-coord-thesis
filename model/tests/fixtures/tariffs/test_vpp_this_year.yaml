# VPP retail tariff with min_export_price_mode=based_on_this_year and NO
# configured min_export_price_dollars_per_mwh, so it exercises the rule that
# the value is required only under mode='fixed'. Absent means a floor of zero
# beneath the derived estimate.
# Identical to test_vpp_rolling apart from the two min_export_price keys.
tariff_class: retail
type: tou
name: Test VPP This Year
state: NSW

usage_tariffs:
  - [0,  15, 20.0]
  - [15, 23, 55.0]
  - [23, 24, 20.0]

feedin_tariffs:
  - [0,  17,  4.0]
  - [17, 21, 29.0]
  - [21, 24,  4.0]

usage_other_c_per_kwh: {}

daily_charges_c_per_day:
  supply: 130.0

vpp:
  exp_reward_c_per_kwh: 100.0
  imp_reward_c_per_kwh: 100.0
  kwh_limit: 250.0
  limit_applies_to: import_and_export
  default_mode: self_consumption
  event_window_hours: 10.0
  vpp_threshold_dollars_per_mwh: 1000.0
  min_export_price_mode: based_on_this_year
