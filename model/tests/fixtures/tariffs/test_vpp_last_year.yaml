# VPP retail tariff naming the unimplemented min_export_price_mode. Parses
# (VppConfig accepts the literal) and is rejected by validate_scenario, which
# is the split this fixture exists to exercise. It states a value as well, so
# the rejection cannot be passing for the absent-value reason instead.
# Identical to test_vpp_rolling apart from min_export_price_mode.
tariff_class: retail
type: tou
name: Test VPP Last Year
state: NSW

usage_tariffs:
  - [0,  15, 20.0]
  - [15, 23, 55.0]
  - [23, 24, 20.0]

feedin_tariffs:
  - [0,  17,  4.0]
  - [17, 21, 29.0]
  - [21, 24,  4.0]

usage_other_c_per_kwh: {}

daily_charges_c_per_day:
  supply: 130.0

vpp:
  exp_reward_c_per_kwh: 100.0
  imp_reward_c_per_kwh: 100.0
  kwh_limit: 250.0
  limit_applies_to: import_and_export
  default_mode: self_consumption
  event_window_hours: 10.0
  vpp_threshold_dollars_per_mwh: 1000.0
  min_export_price_dollars_per_mwh: 500.0
  min_export_price_mode: based_on_last_year
