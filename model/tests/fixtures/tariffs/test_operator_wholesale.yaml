# Minimal wholesale-exposed operator tariff for VPP runs: zero adders, zero
# daily charges, so the operator price stack is wholesale + network only.
tariff_class: retail
type: wholesale_exposed
name: Test Operator Wholesale
state: NSW
gst_on_wholesale_import: false

# A market adder is required, not cosmetic: with zero adders the import and
# export loss factors diverge enough at the market price floor (-$1,000/MWh)
# that p_exp exceeds p_imp, and validate_price_ordering refuses the pair. A
# real wholesale-exposed operator plan always carries one.
usage_other_c_per_kwh:
  market: 8.0
feedin_other_c_per_kwh: {}
daily_charges_c_per_day:
  subscription: 0.0
