tariff_class: retail
type: tou
name: GloBird ZeroHero TOU 2026
state: SA

# usage_tariffs must tile [0, 24).
# The 11-14 window is overridden by block_import_tiers below; 0.0 here makes
# the override intent explicit (the block rate is the only import cost for
# that window -- usage_other still applies per-interval as usual).
usage_tariffs:
  - [0,  12, 49.5]
  - [12, 15,  0.0]
  - [15, 16, 49.5]
  - [16, 23, 57.2]
  - [23, 24, 49.5]

# feedin_tariffs must tile [0, 24).
# The 18-21 window is overridden by block_export_tiers below; 0.0 here
# makes the override intent explicit.
# The use of 0.00001 instead of 0.0 is to ensure feed-in is preferred over curtailment 
# when the export price is zero 
feedin_tariffs:
  - [0,  16,  0.00001]
  - [16, 18,  2.0]
  - [18, 21,  0.0]
  - [21, 23,  2.0]
  - [23, 24,  0.00001]

usage_other_c_per_kwh:
  greenpower: 0.821   # estimated from current Amber plan, Globird does not specify

daily_charges_c_per_day:
  supply: 203.5

# The use of 0.0001 instead of 0.0 is to ensure use of excess solar is preferred 
# over curtailment and import from grid when import price is zero
block_import_tiers:
  - start_hour: 12
    end_hour: 15
    applies_weekends: true
    tiers:
      - threshold_kwh: 50.0
        rate_c_per_kwh: 0.0001
      - threshold_kwh: .inf
        rate_c_per_kwh: 30.8

block_export_tiers:
  - start_hour: 18
    end_hour: 21
    applies_weekends: true
    tiers:
      - threshold_kwh: 15.0
        rate_c_per_kwh: 10.0
      - threshold_kwh: .inf
        rate_c_per_kwh: 2.0

zero_import_reward:
  start_hour: 18
  end_hour: 21
  reward_c_per_day: 100.0
  tolerance_kwh_per_hour: 0.03

# Critical rates replace the export (import) rate, including a block tier
# rate, while the 5-minute RRP is above (below) the threshold; critical flows
# do not count towards the block tiers. Thresholds and rates from GloBird,
# September 2026.
critical_export_rate:
  threshold_dollars_per_mwh: 2000.0
  rate_c_per_kwh: 100.0

critical_import_rate:
  threshold_dollars_per_mwh: -100.0
  rate_c_per_kwh: -5.0
