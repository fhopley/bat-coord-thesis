tariff_class: retail
type: tou
name: Origin Solar Boost TOU 2026
state: NSW

# Sources
# https://www.originenergy.com.au/solar/battery-plans/starter/?planfuel=Elec
# https://www.originenergy.com.au/solar/battery-plans/lite/

# usage_tariffs must tile [0, 24).
usage_tariffs:
  - [0,  15, 24.04]
  - [15, 21, 60.14]
  - [21, 24, 24.04]
  
# feedin_tariffs must tile [0, 24).
feedin_tariffs:
  - [0,   24,  0]
  
block_export_tiers:
  - start_hour: 0
    end_hour: 24
    applies_weekends: true
    tiers:
      - threshold_kwh: 8.0
        rate_c_per_kwh: 8.0
      - threshold_kwh: .inf
        rate_c_per_kwh: 3.0

usage_other_c_per_kwh:
  greenpower: 4.5   # Based on Origin Energy published greenpower rates https://www.originenergy.com.au/electricity-gas/greenpower/
  
daily_charges_c_per_day:
  supply: 176.33