# Single-scenario example: one state, one year, one battery spec.
# Run command:
#   python3 -u -m model.main model/configs/example_vpp_tou_event.yaml 2>&1 | tee logs/example_vpp_tou_event_$(date +%Y%m%d_%H%M%S).log
#
# With save_flows (careful, large output):
#   python3 -u -m model.main model/configs/example_vpp_tou_event.yaml --save-flows 2>&1 | tee logs/example_vpp_tou_event_$(date +%Y%m%d_%H%M%S).log
#
# Output: data/output/runs/example_vpp_tou_event/scenarios/NSW_2022_{name}/

name: example_vpp_tou_event

states: [NSW]
years: [2022]

cohort: solar_battery
coordination_type: vpp_tou_event

network_tariff_id: ausgrid_ea025_network_2024
retail_tariff_id: agl_battery_rewards_vpp_2025
op_retail_tariff_id: agl_operator_wholesale_2025

battery_spec:
    capacity_kwh: 20.0
    backup_reserve_pct: 10.0
    power_kw: 10.0
    charge_efficiency: 0.95
    discharge_efficiency: 0.95
    c_deg_per_kwh: 0.005
