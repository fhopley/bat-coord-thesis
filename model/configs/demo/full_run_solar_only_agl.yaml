# Demo version of model/configs/full_run_solar_only_agl.yaml, generated by
# model/scripts/make_demo_configs.py. Runs the sample household H0001
# for states [NSW] and years [2022, 2023, 2024]. Only the states: and years:
# settings differ from the full run.
#
# Full run — solar-only baseline for AGL
#
# Run command (serial; SC is fast, ~3 min total):
#   python3 -u -m model.main model/configs/demo/full_run_solar_only_agl.yaml \
#       2>&1 | tee logs/full_run_solar_only_agl_$(date +%Y%m%d_%H%M%S).log
#
# With save_flows (careful, large output):
#   python3 -u -m model.main model/configs/demo/full_run_solar_only_agl.yaml --save-flows 2>&1 | tee logs/full_run_solar_only_agl_$(date +%Y%m%d_%H%M%S).log
#
# Output: data/output/runs/full_run_solar_only_agl/scenarios/{state}_{year}/

